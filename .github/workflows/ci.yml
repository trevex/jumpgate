name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job per independent slice, run in parallel. Each slice's commands are
  # single-sourced in the Makefile (ci-*, lint); this workflow only wires the
  # Nix devshell and picks the target. The kind-cluster + Playwright scenarios do
  # NOT run here — see nightly.yml.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: go, target: ci-go }
          - { name: rust, target: ci-rust }
          - { name: rdp-rust, target: ci-rdp }
          - { name: web, target: ci-web }
          - { name: generation, target: ci-gen }
          - { name: lint, target: lint }
          - { name: chart, target: chart-test }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      # Fast, single-user Nix install that pairs with cache-nix-action below.
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-outputs = true
            keep-derivations = true

      # Persist /nix/store across runs so the devshell is restored from the
      # GitHub Actions cache instead of re-fetched from cache.nixos.org.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'warden/go.mod', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never

      # Build the devshell into a profile — registers a GC root so the cache
      # step's garbage collection keeps the whole toolchain closure.
      - name: Build devshell
        run: nix develop --profile "$RUNNER_TEMP/devshell" -c true

      - name: Run ${{ matrix.name }}
        run: nix develop --profile "$RUNNER_TEMP/devshell" -c make ${{ matrix.target }}
