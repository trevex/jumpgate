name: nightly
# The kind-cluster black-box e2e and the Playwright identity-rotation scenarios
# are slow and need docker/kind, so they run on a schedule (and on demand) rather
# than on every push. Per-push checks live in ci.yml.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # Separate jobs (separate runners) so each owns its own kind cluster.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cluster-e2e, target: e2e-cluster }
          - { name: ui-e2e, target: ui-e2e }
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-outputs = true
            keep-derivations = true

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'warden/go.mod', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never

      - name: Build devshell
        run: nix develop --profile "$RUNNER_TEMP/devshell" -c true

      - name: Run ${{ matrix.name }}
        run: nix develop --profile "$RUNNER_TEMP/devshell" -c make ${{ matrix.target }}
