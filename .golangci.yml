version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    # DB-heavy codebase: catch unchecked rows.Err()/unclosed rows.Scan iterations and
    # error comparisons that break on wrapping.
    - rowserrcheck
    - sqlclosecheck
    - errorlint
  exclusions:
    generated: lax
    rules:
      - path: 'warden/gen/'
        linters: [revive, gosec, staticcheck]
      - path: 'internal/postgres/sqlc/'
        linters: [revive, gosec, staticcheck]
      # `make ci` lints only the warden and cli modules (per-directory), so this rule
      # applies to repo-root runs — the pre-commit golangci-lint hook lints changed
      # files from the root. The e2e harness is a black-box test driver: it
      # deliberately execs the jumpgate CLI and kubectl with variable args (gosec
      # G204) and writes fixture files/dirs, so gosec is noise here. unused is
      # excluded too: harness helpers are added alongside the acts that call them, so
      # a helper can be briefly unused between commits.
      - path: 'test/e2e/'
        linters: [gosec, unused]
formatters:
  enable:
    - gofmt
