# Independent password-auth sshd test-workload ("protected server") for the
# jumpgate demo/e2e.
#
# This is a plain manifest applied directly (not part of the jumpgate Helm
# chart). It stands in for a real target host the admin onboards via the CLI,
# whose asset credential is a stored username/password (demo / demo-password-123).
# No SSH CA trust is required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-target-password
  labels:
    app: ssh-target-password
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssh-target-password
  template:
    metadata:
      labels:
        app: ssh-target-password
    spec:
      containers:
        - name: sshd
          image: jumpgate/testworkload-sshd-password:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 22
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-target-password
  labels:
    app: ssh-target-password
spec:
  type: ClusterIP
  selector:
    app: ssh-target-password
  ports:
    - name: ssh
      port: 22
      targetPort: 22
