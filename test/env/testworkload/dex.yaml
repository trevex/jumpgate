# Dex (https://dexidp.io) as the test OIDC IdP for the kind e2e/demo environment.
#
# Issuer/reachability: the issuer is a single string that must (1) match the
# ID token `iss` go-oidc verifies, (2) be reachable by warden in-cluster (it
# discovers Dex and does the token exchange there), and (3) be reachable by
# whoever drives the browser leg of the login (a real browser in the demo, or
# the scripted e2e client in test/e2e/oidc_test.go). Dex derives every endpoint
# in its discovery document (authorization_endpoint, token_endpoint, ...) from
# the issuer, so both the browser and warden hit this exact host:port.
#
# We use `dex.localhost` to satisfy all three without any /etc/hosts edit:
#   - Browsers resolve any *.localhost name to loopback natively (Chrome, and
#     Firefox since 84), so the host reaches Dex at 127.0.0.1:5556, which
#     cluster.yaml forwards to the NodePort below.
#   - In-cluster, warden resolves `dex.localhost` via a CoreDNS `rewrite` rule
#     (added in the Makefile kind-up target) that points it at the Dex Service
#     DNS name, so warden reaches the same Dex over the cluster network.
# The e2e test process runs on the host but isn't a browser, so it rewrites
# `dex.localhost:5556` to the NodePort in-process; see oidc_test.go.
#
# Connector: the client_id/secret below are demo-only, not real secrets.
# Static client `jumpgate` matches demo-values.yaml's warden.oidc.clientId,
# and its own secret lands in a Secret that demo-values.yaml's
# warden.oidc.clientSecret references. The `mockCallback` connector
# (registered in dex's own binary — connector/mock/connectortest.go
# NewCallbackConnector — for exactly this kind of test) always asserts one
# fixed identity (email kilgore@kilgore.trout, groups ["authors"]) with zero
# configuration and zero user interaction: dex auto-skips the connector/login
# screen when only one connector is configured, so the whole auth-code dance
# is a chain of plain redirects the e2e test's http.Client can follow without
# scraping an HTML login form. That determinism (and the ID token's
# email/email_verified/groups claims) is exactly what the task needs to
# assert JIT-provisioning + group sync; it trades away a real password-login
# form, which the task's own plan offers as an equally-valid alternative.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
data:
  # Mounted at the image's default config path (Dockerfile CMD), so the
  # Deployment below needs no command/args override.
  config.docker.yaml: |
    issuer: http://dex.localhost:5556
    storage:
      type: memory
      config: {}
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
    staticClients:
      - id: jumpgate
        name: Jumpgate
        secret: jumpgate-dex-demo-secret
        redirectURIs:
          - http://localhost:8080/auth/oidc/callback
    connectors:
      - type: mockCallback
        id: mock
        name: Example
        config: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: jumpgate-oidc-client-secret
type: Opaque
stringData:
  # Key matches the Helm chart's warden.oidc.clientSecret.secretKey default.
  oidc-client-secret: jumpgate-dex-demo-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      containers:
        - name: dex
          image: dexidp/dex:v2.45.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5556
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 5556
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/dex/config.docker.yaml
              subPath: config.docker.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dex-config
---
apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  # NodePort (not ClusterIP) so the host — and the e2e test process, which
  # runs outside the cluster — can reach the same Dex instance warden talks
  # to in-cluster. See cluster.yaml for the hostPort mapping.
  type: NodePort
  selector:
    app: dex
  ports:
    - name: http
      port: 5556
      targetPort: 5556
      nodePort: 30556
