apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-target
  labels:
    app: pg-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-target
  template:
    metadata:
      labels:
        app: pg-target
    spec:
      containers:
        - name: postgres
          image: jumpgate/testworkload-pg-target:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              value: "superpw"
            - name: POSTGRES_DB
              value: "appdb"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pg-target
spec:
  selector:
    app: pg-target
  ports:
    - port: 5432
      targetPort: 5432
