# kind cluster for the jumpgate containerized demo/e2e environment.
#
# One control-plane node. The Helm chart exposes warden's user API and the
# gateway's external listener via NodePorts; extraPortMappings forward those
# NodePorts to fixed localhost ports so the CLI (and host tooling) can reach
# them directly.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Disable kind's default CNI (kindnet) so Cilium can be installed instead. kindnet
# does NOT enforce NetworkPolicy; Cilium does, so the chart's default-deny + allow
# policies are actually exercised on every e2e run. kind keeps its own kube-proxy
# (the default), so Cilium installs with kubeProxyReplacement=false and needs no
# extra API-server host wiring.
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # warden user API  (service.warden.nodePort)
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443   # gateway external (service.gateway.nodePort)
        hostPort: 8443
        protocol: TCP
      - containerPort: 30444   # gateway insecure ws:// (service.gateway.insecureNodePort) — DEV ONLY
        hostPort: 8444
        protocol: TCP
      - containerPort: 30900   # silo S3      (service.silo.nodePort) for presigned downloads
        hostPort: 30900
        protocol: TCP
      - containerPort: 30556   # dex OIDC IdP (see testworkload/dex.yaml) for the e2e OIDC login test
        hostPort: 5556
        protocol: TCP
