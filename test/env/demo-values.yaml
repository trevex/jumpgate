# Helm values for the kind demo/e2e environment.
#
# These override the chart defaults so the stack is reachable from the host via
# the kind extraPortMappings (see cluster.yaml): warden on localhost:8080,
# gateway on localhost:8443.
warden:
  # What warden tells the CLI to dial for the data plane. Matches the gateway
  # NodePort forwarded to the host by the kind cluster.
  gatewayEndpoint: "localhost:8443"
  # kind serves the warden API (and the embedded SPA) over plain HTTP, so the
  # browser rejects Secure cookies. Drop the Secure flag for the demo/e2e env.
  cookieInsecure: true

masterKey:
  # STABLE base64-encoded 32-byte demo vault master key. Kept constant so that
  # re-installs can still decrypt data sealed by a prior install.
  # decodes to the 32-byte ASCII string "jumpgate-demo-master-key-32bytes".
  value: "anVtcGdhdGUtZGVtby1tYXN0ZXIta2V5LTMyYnl0ZXM="

bootstrapAdmin:
  email: admin@demo.test
  password: admin-password-1234

recording:
  s3:
    # Presigned download URLs must be reachable from the host CLI. Expose silo on
    # a NodePort forwarded to localhost:30900 (cluster.yaml) and have warden sign
    # that host; the worker still uploads via the in-cluster endpoint.
    publicEndpoint: "http://localhost:30900"

service:
  silo: { nodePort: 30900 }

# The chart ships with the bundled Postgres OFF (a production install points warden
# at a customer-operated DB). For the local kind demo/e2e we re-enable the in-cluster
# Postgres so the stack has a working database out of the box.
postgres:
  enabled: true
