version: "2"
sql:
  - engine: "postgresql"
    schema: "control-plane/internal/db/migrate/migrations"
    queries: "control-plane/internal/db/queries"
    gen:
      go:
        package: "gen"
        out: "control-plane/internal/db/gen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
