version: "2"
sql:
  - engine: "postgresql"
    schema: "warden/internal/postgres/migrate/migrations"
    queries: "warden/internal/postgres/queries"
    gen:
      go:
        package: "sqlc"
        out: "warden/internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
