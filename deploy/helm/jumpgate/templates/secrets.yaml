{{- if not .Values.masterKey.existingSecret }}
# Envelope-crypto master key consumed by secrets.MasterKeyFromConfig, which
# expects a base64-encoded 32-byte key. Sprig's `randBytes 32` already yields a
# base64 string of 32 random bytes, so it goes under stringData (Kubernetes
# base64-encodes stringData on write, giving the data: encoding the app reads).
#
# NOTE: when masterKey.value is unset this uses `randBytes 32`, which regenerates
# on every `helm upgrade` render. That is acceptable for the ephemeral demo DB, but
# for any persistent deployment set masterKey.value (or masterKey.existingSecret) so
# the key is STABLE across upgrades — a rotating master key orphans sealed data.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jumpgate.masterKeySecret" . }}
  labels:
    {{- include "jumpgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  VAULT_MASTER_KEY: {{ .Values.masterKey.value | default (randBytes 32) | quote }}
{{- end }}
{{- if not .Values.bootstrapAdmin.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jumpgate.adminSecret" . }}
  labels:
    {{- include "jumpgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  email: {{ .Values.bootstrapAdmin.email | quote }}
  password: {{ .Values.bootstrapAdmin.password | quote }}
{{- end }}
