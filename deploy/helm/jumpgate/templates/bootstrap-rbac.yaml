apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jumpgate.fullname" . }}-bootstrap
  labels:
    {{- include "jumpgate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "jumpgate.fullname" . }}-bootstrap
  labels:
    {{- include "jumpgate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "jumpgate.fullname" . }}-bootstrap
  labels:
    {{- include "jumpgate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "jumpgate.fullname" . }}-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "jumpgate.fullname" . }}-bootstrap
    namespace: {{ .Release.Namespace }}
