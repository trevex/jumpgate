nameOverride: ""
fullnameOverride: ""

images:
  warden:   { repository: jumpgate/warden,    tag: dev, pullPolicy: IfNotPresent }
  gateway:  { repository: jumpgate/gateway,   tag: dev, pullPolicy: IfNotPresent }
  sshProxy: { repository: jumpgate/ssh-proxy, tag: dev, pullPolicy: IfNotPresent }
  # The bootstrap Job's apply step needs kubectl + a shell. alpine/kubectl fits
  # (the official registry.k8s.io/kubectl is distroless and has no shell).
  kubectl:  { repository: alpine/kubectl,     tag: "1.34.1", pullPolicy: IfNotPresent }

warden:
  databaseUrl: ""          # DEPRECATED alias for database.url (kept for back-compat); prefer database.*
  gatewayEndpoint: ""      # external addr the CLI dials; default localhost:<gateway nodePort>
  logLevel: info
  cookieInsecure: false    # dev/demo only: drop the Secure cookie flag (HTTP access); prod keeps false
  # DEV ONLY: host:port the browser uses to reach the gateway's plaintext (ws://)
  # listener for the in-browser terminal. Only consulted when gateway.insecure.enabled.
  # Empty leaves the insecure path disabled in warden (fail-closed).
  gatewayInsecureEndpoint: ""

# DEV ONLY: an optional plaintext (no-TLS) gateway listener so a browser console
# served over plain http can use the in-browser terminal over ws:// (the mesh-CA
# external cert isn't browser-trusted). DEFAULT OFF and fail-closed to secure:
# enabling it also flips warden's ALLOW_INSECURE_SESSIONS. Auth is unchanged —
# only transport TLS is dropped. NEVER enable in production.
gateway:
  insecure:
    enabled: false
    port: 8444             # plaintext listener + container port

masterKey:
  existingSecret: ""       # Secret containing key VAULT_MASTER_KEY; else generated
  value: ""                # optional inline base64 32-byte key (demo); else random-generated

mesh:
  ca:
    existingSecret: ""     # Secret with tls.crt/tls.key of the mesh CA; else bootstrap generates

bootstrapAdmin:
  existingSecret: ""       # Secret with keys: email, password
  email: admin@demo.test
  password: admin-password-1234

worker:
  id: worker-0
  capacity: 10

recording:
  bucket: jumpgate-recordings
  s3:
    endpoint: ""           # worker upload endpoint; default http://<release>-silo:9000 when silo.enabled
    # publicEndpoint is the host warden signs into download URLs. Presigning is
    # offline, so this only sets the URL host — it must be reachable by whoever
    # downloads (an auditor), which the in-cluster endpoint usually is not. Empty
    # falls back to the worker endpoint.
    publicEndpoint: ""
    region: us-east-1
    accessKey: minioadmin
    secretKey: minioadmin-demo-secret

# Bundled in-cluster Postgres. DEMO/DEV ONLY — single replica, emptyDir storage,
# no backups/HA/PITR. DISABLED by default: a production install must run Postgres
# externally (a managed service or an in-cluster operator like CloudNativePG) and
# point warden at it via database.* below. The kind/demo values re-enable it.
postgres:
  enabled: false
  image: postgres:17
  user: jumpgate
  password: jumpgate
  database: jumpgate

# External database, used when postgres.enabled=false. Provide EITHER an inline
# connection string (database.url) OR a reference to an existing Secret holding the
# DSN (database.existingSecret + database.existingSecretKey). The existing-secret
# path is preferred for production so the DSN/password never lives in Helm values.
# warden runs its embedded goose migrations against whichever database it points at.
database:
  url: ""                  # e.g. postgres://user:pass@host:5432/jumpgate?sslmode=require
  existingSecret: ""       # Secret name holding the DSN (takes precedence over url)
  existingSecretKey: uri   # key within existingSecret (CloudNativePG app secret uses "uri")

silo:
  enabled: true
  image: pgsty/silo:latest

certManager:
  issuerName: jumpgate-mesh-ca
  duration: 2160h          # 90d
  renewBefore: 360h        # 15d

service:
  warden:  { nodePort: 30080 }
  # insecureNodePort exposes the DEV-ONLY plaintext gateway listener (only when
  # gateway.insecure.enabled). Reach it from the host via a kind extraPortMapping.
  gateway: { nodePort: 30443, insecureNodePort: 30444 }
  # Optional NodePort exposing silo's S3 port so a host client can fetch presigned
  # download URLs. Empty = ClusterIP only (no external S3 access).
  silo:    { nodePort: "" }

resources: {}
