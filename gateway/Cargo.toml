[package]
name = "gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
axum.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rand = "0.8"
thiserror = "1"
pasetors = "0.8.0"
jumpgate-mesh = { path = "../mesh" }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
httparse = "1.10.1"
http = "1.5.0"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
http-body-util = "0.1"
rcgen = "0.13"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "std"] }
