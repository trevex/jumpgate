syntax = "proto3";

package jumpgate.vault.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/trevex/jumpgate/warden/gen/jumpgate/vault/v1;vaultv1";

// VaultService is the admin API for the credential vault: certificate-authority
// lifecycle (init + public-material retrieval) and per-asset stored secrets. Every
// RPC is admin-guarded. Sealed private material (CA keys, stored secrets) is NEVER
// returned — only public material and secret metadata leave the server. (SSH asset
// connection config lives on CatalogService, which owns the asset.)
service VaultService {
  // Certificate authorities.
  rpc InitCA(InitCARequest) returns (InitCAResponse) {}
  rpc GetCAPublic(GetCAPublicRequest) returns (GetCAPublicResponse) {}

  // Mesh mTLS CA. InitMeshCA generates the dedicated internal mesh CA (private
  // key sealed) and returns its cert PEM. IssueMeshCert signs a client-generated
  // CSR into a mesh leaf carrying the trusted spiffe_id in its URI SAN — the
  // private key is generated by the client and NEVER travels over the wire.
  rpc InitMeshCA(InitMeshCARequest) returns (InitMeshCAResponse) {}
  rpc IssueMeshCert(IssueMeshCertRequest) returns (IssueMeshCertResponse) {}

  // InitSessionKey generates the active session-token signing key (Ed25519, private
  // half sealed). Admin-only; a second init hits the unique-active index.
  rpc InitSessionKey(InitSessionKeyRequest) returns (InitSessionKeyResponse) {}

  // Per-asset stored secrets (write-only in; metadata-only out).
  rpc SetAssetSecret(SetAssetSecretRequest) returns (SetAssetSecretResponse) {}
  rpc DeleteAssetSecret(DeleteAssetSecretRequest) returns (DeleteAssetSecretResponse) {}
  rpc ListAssetSecrets(ListAssetSecretsRequest) returns (ListAssetSecretsResponse) {}
}

message InitCARequest {
  string kind = 1 [(buf.validate.field).string = {in: ["ssh", "x509"]}];
}
message InitCAResponse { string public_material = 1; }

message GetCAPublicRequest {
  string kind = 1 [(buf.validate.field).string = {in: ["ssh", "x509"]}];
}
message GetCAPublicResponse { string public_material = 1; }

message InitMeshCARequest {}
message InitMeshCAResponse { bytes ca_cert_pem = 1; }

message IssueMeshCertRequest {
  bytes csr_pem = 1 [(buf.validate.field).bytes.min_len = 1];
  string spiffe_id = 2 [(buf.validate.field).string.min_len = 1];
}
message IssueMeshCertResponse {
  bytes cert_pem = 1;
  bytes ca_bundle_pem = 2;
}

message InitSessionKeyRequest {}
message InitSessionKeyResponse {
  bytes public_key = 1;
}

message SetAssetSecretRequest {
  string asset_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1}];
  bytes value = 3;
}
message SetAssetSecretResponse { string id = 1; }

message DeleteAssetSecretRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteAssetSecretResponse {}

message ListAssetSecretsRequest {
  string asset_id = 1 [(buf.validate.field).string.uuid = true];
}
// AssetSecretMeta is metadata ONLY: the sealed value is never exposed.
message AssetSecretMeta {
  string id = 1;
  string name = 2;
  string created_at = 3;
}
message ListAssetSecretsResponse { repeated AssetSecretMeta secrets = 1; }
