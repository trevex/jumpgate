syntax = "proto3";

package jumpgate.identity.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/trevex/jumpgate/warden/gen/jumpgate/identity/v1;identityv1";

// IdentityService manages local users, groups, and nested memberships.
// All RPCs require an admin bearer token.
service IdentityService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {}
  rpc ResolveUser(ResolveUserRequest) returns (ResolveUserResponse) {}
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}

  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {}
  rpc ResolveGroup(ResolveGroupRequest) returns (ResolveGroupResponse) {}
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {}
  rpc AddUserToGroup(AddUserToGroupRequest) returns (AddUserToGroupResponse) {}
  rpc AddGroupToGroup(AddGroupToGroupRequest) returns (AddGroupToGroupResponse) {}
  rpc RemoveUserFromGroup(RemoveUserFromGroupRequest) returns (RemoveUserFromGroupResponse) {}
  rpc RemoveGroupFromGroup(RemoveGroupFromGroupRequest) returns (RemoveGroupFromGroupResponse) {}
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse) {}

  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse) {}
  rpc ReactivateUser(ReactivateUserRequest) returns (ReactivateUserResponse) {}
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {}
}

message User {
  string id           = 1;
  string email        = 2;
  string display_name = 3;
  reserved 4;
  reserved "is_admin";
}

message Group {
  string id          = 1;
  string name        = 2;
  string folder_id   = 3;   // empty = global
  string folder_path = 4;   // DNS path; empty = global (single-group reads)
}

message CreateUserResponse {
  User user = 1;
}

message GetUserResponse {
  User user = 1;
}

message CreateGroupResponse {
  Group group = 1;
}

message CreateUserRequest {
  string email        = 1 [(buf.validate.field).string.email = true];
  string display_name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
  string password     = 3 [(buf.validate.field).string.min_len = 8];
  reserved 4;
  reserved "is_admin";
}

message GetUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ResolveUserRequest {
  string email = 1 [(buf.validate.field).string = {min_len: 1}];
}
message ResolveUserResponse {
  string user_id = 1;
}

message ResolveGroupRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1}];
}
message ResolveGroupResponse {
  string group_id = 1;
  string path     = 2;
}

message ListUsersRequest {
  int32  page_size  = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  string page_token = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message CreateGroupRequest {
  string name      = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200, pattern: "^[a-z0-9_-]+$"}];
  string folder_id = 2 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];  // empty = global
}

message ListGroupsRequest {
  int32  page_size  = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  string page_token = 2;
  string parent     = 3; // folder id or DNS path; empty = root (folder-less groups + all folders)
  bool   cascade    = 4; // descend the whole subtree; default false = direct children only
}

message ListGroupsResponse {
  repeated Group groups = 1;
  string next_page_token = 2;
}

message AddUserToGroupRequest {
  string group_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id  = 2 [(buf.validate.field).string.uuid = true];
}
message AddUserToGroupResponse {}

message AddGroupToGroupRequest {
  string group_id        = 1 [(buf.validate.field).string.uuid = true];
  string member_group_id = 2 [(buf.validate.field).string.uuid = true];
}
message AddGroupToGroupResponse {}

message RemoveUserFromGroupRequest {
  string group_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id  = 2 [(buf.validate.field).string.uuid = true];
}
message RemoveUserFromGroupResponse {}

message RemoveGroupFromGroupRequest {
  string group_id        = 1 [(buf.validate.field).string.uuid = true];
  string member_group_id = 2 [(buf.validate.field).string.uuid = true];
}
message RemoveGroupFromGroupResponse {}

message ListGroupMembersRequest {
  string group_id   = 1 [(buf.validate.field).string.uuid = true];
  int32  page_size  = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  string page_token = 3;
}
message ListGroupMembersResponse {
  repeated User  users           = 1;
  repeated Group groups          = 2;
  string         next_page_token = 3;
}

message DeactivateUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeactivateUserResponse {}

message ReactivateUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
message ReactivateUserResponse {}

message DeleteUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteUserResponse {}

message DeleteGroupRequest {
  string group_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteGroupResponse {}
