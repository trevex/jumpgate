syntax = "proto3";
package jumpgate.dataplane.v1;
import "buf/validate/validate.proto";
option go_package = "github.com/trevex/jumpgate/warden/gen/jumpgate/dataplane/v1;dataplanev1";

// DataplaneService is the worker↔warden control contract. It is worker-facing and
// (in M4a) assumes a trusted network; mTLS worker identity lands in M4b.
service DataplaneService {
  // WorkerStream is the worker's lifeline: it registers, heartbeats, and reports
  // session ends (client→server); warden pushes teardown signals (server→client).
  // The stream's lifetime is the worker's liveness.
  rpc WorkerStream(stream WorkerMessage) returns (stream ServerMessage) {}

  // PrepareSession redeems a session token and records the live session, returning
  // the endpoint, protocol/recording policy, current endpoint revision, and the
  // asset's active trust anchors — but NEVER a credential. The worker connects and
  // authenticates the target ITSELF against these anchors, then calls
  // IssueSessionCredential only after a successful identity match.
  rpc PrepareSession(PrepareSessionRequest) returns (PrepareSessionResponse) {}

  // IssueSessionCredential releases the target credential for a prepared session,
  // and ONLY after warden re-confirms the worker's observed target identity matches
  // a current active anchor. The calling worker must own the prepared session and
  // report the current endpoint revision. Any mismatch, stale revision, wrong
  // worker, or revoked/absent anchor is refused without minting a credential.
  rpc IssueSessionCredential(IssueSessionCredentialRequest) returns (IssueSessionCredentialResponse) {}
}

message WorkerMessage {
  oneof msg {
    Register register = 1;
    Heartbeat heartbeat = 2;
    SessionEnded session_ended = 3;
    AdvertiseTunnels advertise_tunnels = 4;
    ProbeResult probe_result = 5;
    ReportApiServerIdentity api_server_identity = 6;
  }
}
// AdvertiseTunnels is the broker's current set of held agent tunnels, re-sent
// whenever an agent connects or disconnects. Each held tunnel carries the agent's
// verified mesh leaf certificate (DER) so warden re-derives the bound asset id
// from the SPIFFE SAN itself rather than trusting the broker's advertised list.
// asset_ids is retained for logging/back-compat only; warden ignores it when
// agents is populated (a compromised broker cannot forge a valid agent cert).
message AdvertiseTunnels {
  repeated string asset_ids = 1;
  repeated AgentBinding agents = 2;
}
// AgentBinding is one held agent tunnel: the agent's verified mesh leaf cert (DER).
message AgentBinding { bytes agent_cert_der = 1; }
// ReportApiServerIdentity carries the API-server TLS evidence an in-cluster agent
// observed for its bound asset, relayed by the broker over its control stream.
// agent_cert_der is the agent's verified mesh leaf so warden binds the observation
// to the SPIFFE-derived asset id, not to the broker's claim. It never carries a
// ServiceAccount token — the agent probe stops at the TLS handshake.
message ReportApiServerIdentity {
  bytes agent_cert_der = 1;
  string server_name = 2; // API-server name the agent connected to
  repeated bytes chain_der = 3; // presented certificate chain, leaf-first (DER)
}
message Register {
  string worker_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated string protocols = 2;
  int32 capacity = 3;
  repeated string live_session_ids = 4; // reconnect reconciliation
  string dataplane_address = 5; // data-plane listen address the gateway dials
}
message Heartbeat {}
message SessionEnded {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2;
  RecordingInfo recording = 3; // present when the session was recorded (or a recording was attempted)
}

// RecordingInfo is the worker's report of a session recording's disposition.
message RecordingInfo {
  string object_key = 1; // recordings/ssh/<yyyy>/<mm>/<dd>/<session_id>.cast
  int64 size_bytes = 2; // total bytes uploaded
  string sha256 = 3; // hex sha256 over the exact uploaded bytes
  int64 started_at_unix_ms = 4;
  int64 ended_at_unix_ms = 5;
  string status = 6; // "completed" | "failed" | "aborted"
  string grant_id = 7; // the JIT grant that authorized the session; empty = standing/unattributed

  // Self-contained attribution for workers with no live_sessions row (k8s broker):
  // when user_id is set, warden persists the recording from these fields directly
  // instead of resolving parties from live_sessions.
  string user_id = 8;
  string asset_id = 9;
  string worker_id = 10;
  string session_id = 11; // the token jti (audit session) this recording belongs to
}

message ServerMessage {
  oneof msg {
    RegisterAck ack = 1;
    Teardown teardown = 2;
    ProbeAssignment probe_assignment = 3;
  }
}
message RegisterAck {}
message Teardown {
  string session_id = 1;
  string reason = 2;
}

// ProbeProtocol is deliberately independent from user-facing API enums: this is
// the authenticated worker control contract.
enum ProbeProtocol {
  PROBE_PROTOCOL_UNSPECIFIED = 0;
  PROBE_PROTOCOL_SSH = 1;
  PROBE_PROTOCOL_POSTGRES = 2;
  PROBE_PROTOCOL_RDP = 3;
  PROBE_PROTOCOL_KUBERNETES = 4;
}

enum ProbeOutcome {
  PROBE_OUTCOME_UNSPECIFIED = 0;
  PROBE_OUTCOME_SUCCEEDED = 1;
  PROBE_OUTCOME_FAILED = 2;
}

enum ProbeFailureCategory {
  PROBE_FAILURE_CATEGORY_UNSPECIFIED = 0;
  PROBE_FAILURE_CATEGORY_UNSUPPORTED_PROTOCOL = 1;
  PROBE_FAILURE_CATEGORY_NO_COMPATIBLE_WORKER = 2;
  PROBE_FAILURE_CATEGORY_DNS_RESOLUTION_FAILED = 3;
  PROBE_FAILURE_CATEGORY_CONNECTION_REFUSED = 4;
  PROBE_FAILURE_CATEGORY_CONNECTION_TIMEOUT = 5;
  PROBE_FAILURE_CATEGORY_PROTOCOL_MISMATCH = 6;
  PROBE_FAILURE_CATEGORY_INSECURE_DOWNGRADE = 7;
  PROBE_FAILURE_CATEGORY_UNSUPPORTED_IDENTITY_ALGORITHM = 8;
  PROBE_FAILURE_CATEGORY_MALFORMED_IDENTITY = 9;
  PROBE_FAILURE_CATEGORY_IDENTITY_TOO_LARGE = 10;
  PROBE_FAILURE_CATEGORY_CERTIFICATE_EXPIRED = 11;
  PROBE_FAILURE_CATEGORY_CERTIFICATE_NOT_YET_VALID = 12;
  PROBE_FAILURE_CATEGORY_NAME_MISMATCH = 13;
  PROBE_FAILURE_CATEGORY_EXPECTATION_MISMATCH = 14;
  PROBE_FAILURE_CATEGORY_WORKER_LOST = 15;
  PROBE_FAILURE_CATEGORY_LEASE_EXPIRED = 16;
  PROBE_FAILURE_CATEGORY_TARGET_IDENTITY_CHANGED = 17;
}

enum ProbeEvidenceKind {
  PROBE_EVIDENCE_KIND_UNSPECIFIED = 0;
  PROBE_EVIDENCE_KIND_SSH_HOST_KEY = 1;
  PROBE_EVIDENCE_KIND_SSH_HOST_CERTIFICATE = 2;
  PROBE_EVIDENCE_KIND_TLS_LEAF = 3;
  PROBE_EVIDENCE_KIND_TLS_INTERMEDIATE = 4;
  PROBE_EVIDENCE_KIND_TLS_PRESENTED_ROOT = 5;
}

message ProbeLimits {
  int64 dns_timeout_ms = 1 [(buf.validate.field).int64.gt = 0];
  int64 connect_timeout_ms = 2 [(buf.validate.field).int64.gt = 0];
  int64 handshake_timeout_ms = 3 [(buf.validate.field).int64.gt = 0];
  int64 total_timeout_ms = 4 [(buf.validate.field).int64.gt = 0];
  int32 max_banner_bytes = 5 [(buf.validate.field).int32 = {gt: 0, lte: 65536}];
  int32 max_frame_bytes = 6 [(buf.validate.field).int32 = {gt: 0, lte: 1048576}];
  int32 max_chain_certificates = 7 [(buf.validate.field).int32 = {gt: 0, lte: 16}];
  int32 max_certificate_bytes = 8 [(buf.validate.field).int32 = {gt: 0, lte: 65536}];
  int32 max_result_bytes = 9 [(buf.validate.field).int32 = {gt: 0, lte: 1048576}];
}

message SSHProbeEndpoint {
  string host = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  uint32 port = 2 [(buf.validate.field).uint32 = {gt: 0, lte: 65535}];
}

message PostgresProbeEndpoint {
  string host = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  uint32 port = 2 [(buf.validate.field).uint32 = {gt: 0, lte: 65535}];
  string server_name = 3 [(buf.validate.field).string.max_len = 255];
}

message RDPProbeEndpoint {
  string host = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  uint32 port = 2 [(buf.validate.field).uint32 = {gt: 0, lte: 65535}];
  string server_name = 3 [(buf.validate.field).string.max_len = 255];
}

message KubernetesProbeEndpoint {
  string api_server_name = 1 [(buf.validate.field).string.max_len = 255];
}

// ProbeAssignment is public-target-only data. It intentionally has no secret,
// credential, admission-token, login, or user identity field.
message ProbeAssignment {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  string asset_id = 2 [(buf.validate.field).string.uuid = true];
  int64 endpoint_revision = 3 [(buf.validate.field).int64.gt = 0];
  bytes lease_token = 4 [(buf.validate.field).bytes = {min_len: 32, max_len: 32}];
  ProbeProtocol protocol = 5;
  int64 lease_expires_at_unix_ms = 6 [(buf.validate.field).int64.gt = 0];
  ProbeLimits limits = 7 [(buf.validate.field).required = true];
  oneof endpoint {
    option (buf.validate.oneof).required = true;
    SSHProbeEndpoint ssh = 8;
    PostgresProbeEndpoint postgres = 9;
    RDPProbeEndpoint rdp = 10;
    KubernetesProbeEndpoint kubernetes = 11;
  }
}

message ProbeDisplayExtension {
  string name = 1 [(buf.validate.field).string.max_len = 255];
  string value = 2 [(buf.validate.field).string.max_bytes = 4096];
}

message ProbeEvidence {
  ProbeEvidenceKind kind = 1;
  string algorithm = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string sha256_fingerprint = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string public_material = 4 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  string certificate_subject = 5 [(buf.validate.field).string.max_bytes = 4096];
  string certificate_issuer = 6 [(buf.validate.field).string.max_bytes = 4096];
  string issuer_sha256_fingerprint = 7 [(buf.validate.field).string.max_len = 255];
  repeated string dns_names = 8 [(buf.validate.field).repeated = {max_items: 64, items: {string: {max_len: 255}}}];
  repeated string ip_addresses = 9 [(buf.validate.field).repeated = {max_items: 64, items: {string: {max_len: 255}}}];
  repeated string ssh_principals = 10 [(buf.validate.field).repeated = {max_items: 64, items: {string: {max_len: 255}}}];
  string serial_number = 11 [(buf.validate.field).string.max_len = 256];
  int64 valid_from_unix_ms = 12;
  int64 valid_until_unix_ms = 13;
  int32 key_bits = 14 [(buf.validate.field).int32 = {gte: 0, lte: 16384}];
  string key_curve = 15 [(buf.validate.field).string.max_len = 64];
  repeated ProbeDisplayExtension display_extensions = 16 [(buf.validate.field).repeated.max_items = 32];
}

message ProbeSSHMetadata {
  string banner = 1 [(buf.validate.field).string.max_bytes = 4096];
  repeated string host_key_algorithms = 2 [(buf.validate.field).repeated = {max_items: 64, items: {string: {max_len: 255}}}];
}

message ProbeTLSMetadata {
  string version = 1 [(buf.validate.field).string.max_len = 255];
  string cipher_suite = 2 [(buf.validate.field).string.max_len = 255];
  string server_name = 3 [(buf.validate.field).string.max_len = 255];
  string alpn = 4 [(buf.validate.field).string.max_len = 255];
}

message ProbeKubernetesMetadata {
  string api_server_name = 1 [(buf.validate.field).string.max_len = 255];
}

message ProbeResult {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  string asset_id = 2 [(buf.validate.field).string.uuid = true];
  int64 endpoint_revision = 3 [(buf.validate.field).int64.gt = 0];
  bytes lease_token = 4 [(buf.validate.field).bytes = {min_len: 32, max_len: 32}];
  ProbeProtocol protocol = 5;
  ProbeOutcome outcome = 6;
  int64 observed_at_unix_ms = 7 [(buf.validate.field).int64.gt = 0];
  repeated string resolved_addresses = 8 [(buf.validate.field).repeated = {max_items: 16, items: {string: {max_len: 255}}}];
  repeated ProbeEvidence evidence = 9 [(buf.validate.field).repeated.max_items = 16];
  ProbeFailureCategory failure_category = 10;
  string failure_detail = 11 [(buf.validate.field).string.max_bytes = 4096];
  oneof protocol_metadata {
    ProbeSSHMetadata ssh = 12;
    ProbeTLSMetadata tls = 13;
    ProbeKubernetesMetadata kubernetes = 14;
  }
}

// PrepareSessionRequest opens the credential-free first phase of a session. It
// carries the admission inputs (token, worker id, client key, login); the target
// key (Kw) is not needed until credential-issue time.
message PrepareSessionRequest {
  string session_token = 1 [(buf.validate.field).string.min_len = 1];
  string worker_id = 2 [(buf.validate.field).string.min_len = 1];
  bytes client_ssh_public_key = 3; // Kc — cnf-bound for SSH CLI; empty for mode=web browser terminals
  string login = 4 [(buf.validate.field).string.min_len = 1]; // requested target login
}

// SessionTrustAnchor is one current active trust anchor exposed to the worker so
// it can authenticate the target itself. Public constraint material only — no
// secrets, no credentials.
message SessionTrustAnchor {
  string id = 1;
  string kind = 2; // ssh_host_key | ssh_host_ca | tls_leaf | tls_ca
  string algorithm = 3;
  string sha256_fingerprint = 4;
  repeated string required_ssh_principals = 5;
  repeated string required_dns_names = 6;
  repeated string required_ip_addresses = 7;
  // The anchor's approved public material (PEM). For a tls_ca anchor this is the CA
  // cert the worker builds its RootCertStore from; tls_leaf needs none (exact
  // fingerprint match); ssh anchors carry their OpenSSH line (TLS workers ignore it).
  // Public, non-secret material — warden-authoritative, from the approved anchor row.
  string public_material = 8 [(buf.validate.field).string.max_bytes = 65536];
}

// PrepareSessionResponse returns the endpoint, policy, and the trust anchors the
// worker must match — but NEVER a credential.
message PrepareSessionResponse {
  string session_id = 1; // token jti / live_sessions PK
  int64 endpoint_revision = 2; // the asset's current endpoint revision at prepare time
  string target_address = 3;
  bool recording_required = 4;
  string recording_object_key = 5;
  string default_database = 8; // postgres: default DB
  string grant_id = 9; // authorizing JIT grant; empty = standing/unattributed
  string login = 10; // the login/role warden authorized
  repeated SessionTrustAnchor trust_anchors = 11; // current active anchors to match
}

// IssueSessionCredentialRequest releases the target credential for a prepared
// session after the worker has matched the target's identity against one anchor.
message IssueSessionCredentialRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  string worker_id = 2 [(buf.validate.field).string.min_len = 1];
  int64 endpoint_revision = 3 [(buf.validate.field).int64.gt = 0]; // revision the worker prepared against
  string matched_anchor_id = 4 [(buf.validate.field).string.uuid = true]; // the anchor the worker matched
  string observed_fingerprint = 5 [(buf.validate.field).string.min_len = 1]; // the target's observed identity fingerprint
  bytes target_public_key = 6; // Kw — certified for the target (SSH ca path); empty for others
}

// IssueSessionCredentialResponse carries the credential oneof released only after
// a successful identity match.
message IssueSessionCredentialResponse {
  string session_id = 1;
  string login = 2;
  bytes x509_private_key = 3; // postgres mtls: client private key PEM (paired with x509_certificate)
  oneof credential {
    bytes ssh_certificate = 4; // ca: OpenSSH cert over Kw
    string password = 5; // password auth (ssh/rdp)
    bytes private_key = 6; // key auth: OpenSSH private key PEM
    bytes x509_certificate = 7; // postgres mtls: leaf cert PEM
    string pg_password = 8; // postgres password auth
  }
}
