syntax = "proto3";

package jumpgate.catalog.v1;

import "buf/validate/validate.proto";
import "jumpgate/access/v1/access.proto";
import "jumpgate/identity/v1/identity.proto";

option go_package = "github.com/trevex/jumpgate/warden/gen/jumpgate/catalog/v1;catalogv1";

// CatalogService manages folders and assets (admin), and exposes each caller's
// visible asset catalog (any authenticated user). Authorization config (roles,
// grants, bindings, request policies) lives in AccessService.
service CatalogService {
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse) {}
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse) {}
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse) {}
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse) {}
  // GetAssetDisplay returns an asset's decision context (path, kind, and for SSH
  // the target address + available logins) for an approver or requester to judge
  // a request — WITHOUT any secret references. Authorized by catalog:asset:read OR
  // being party to a pending access request that references the asset.
  rpc GetAssetDisplay(GetAssetDisplayRequest) returns (GetAssetDisplayResponse) {}
  rpc UpdateAssetConfig(UpdateAssetConfigRequest) returns (UpdateAssetConfigResponse) {}
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse) {}
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse) {}
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse) {}
  rpc UpdateFolder(UpdateFolderRequest) returns (UpdateFolderResponse) {}
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {}
  rpc GetAssetAccess(GetAssetAccessRequest) returns (GetAssetAccessResponse) {}
  rpc GetFolderAccess(GetFolderAccessRequest) returns (GetFolderAccessResponse) {}
  rpc ResolveAsset(ResolveAssetRequest) returns (ResolveAssetResponse) {}
  rpc ResolveFolder(ResolveFolderRequest) returns (ResolveFolderResponse) {}
  // ListFolderContents returns the first bounded slice of each child kind
  // (folders, assets, roles, groups) visible to the caller under one folder.
  // parent="" or omitted = root. has_more=true means additional items exist
  // beyond the 50-item first slice.
  rpc ListFolderContents(ListFolderContentsRequest) returns (ListFolderContentsResponse) {}
  // SearchCatalog finds catalog entities (folders/assets/roles/groups) whose name
  // matches the query, filtered to what the caller may see. Any authenticated caller.
  rpc SearchCatalog(SearchCatalogRequest) returns (SearchCatalogResponse) {}
}

message Folder { string id = 1; string name = 2; string parent_id = 3; string path = 4; }

// Asset is a target in the catalog. The typed per-kind connection config (config)
// is populated only by single-asset reads (GetAsset); list responses leave it empty
// so they never carry connection details like stored_secret_id/target_address.
message Asset {
  string id = 1;
  string folder_id = 2;
  string name = 3;
  string kind = 4;
  oneof config { SSHConfig ssh = 5; }
  string path = 6;
}

// SSHConfig is an SSH asset's connection + auth config. stored_secret_id references
// a sealed secret in the vault (asset_secrets); the bytes never live here.
// SSHConfig is an SSH asset's connection config plus its per-login auth. Each
// login is authenticated by its own kind: "ca" (short-lived signed cert),
// "password", or "key" (a plain stored secret referenced by secret_id). The
// stored secret holds only the password bytes or private-key PEM; the username is
// the login and the kind lives here.
message SSHConfig {
  repeated SSHLogin logins = 1;
  // Optional OpenSSH authorized_keys line; when set the ssh-proxy worker pins the
  // target host key, empty = accept-and-log.
  string host_public_key = 2;
  // Optional host:port the ssh-proxy worker dials; empty = worker default resolution.
  string target_address = 3;
}

// SSHLogin is one target login and how the worker authenticates as it.
message SSHLogin {
  string login = 1 [(buf.validate.field).string = {min_len: 1}];
  string kind = 2 [(buf.validate.field).string = {in: ["ca", "password", "key"]}];
  // Reference to a vault stored secret (asset_secrets.id); required for
  // password|key, empty for ca. The secret must belong to the same asset.
  string secret_id = 3;
}

// ── Write-only SSH config input. Reads still return SSHConfig/SSHLogin. ──
message SSHConfigInput {
  repeated SSHLoginInput logins = 1;
  string host_public_key = 2;
  string target_address  = 3;
}

// SSHLoginInput: the auth oneof arm IS the kind (no stringly-typed "ca|password|key").
message SSHLoginInput {
  string login = 1 [(buf.validate.field).string = {min_len: 1}];
  oneof auth {
    option (buf.validate.oneof).required = true;
    CaAuth     ca       = 2;   // signed cert — no secret
    SecretAuth password = 3;   // plaintext password
    SecretAuth key      = 4;   // private-key PEM
  }
}
message CaAuth {}

// SecretAuth: "any of" — seal a new value, or reference an existing sealed secret.
message SecretAuth {
  oneof source {
    option (buf.validate.oneof).required = true;
    bytes  new_value          = 1 [(buf.validate.field).bytes.min_len = 1];  // write-only; sealed server-side in-tx, never echoed back
    string existing_secret_id = 2 [(buf.validate.field).string.uuid = true];
  }
}

message CreateFolderRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200, pattern: "^[a-zA-Z0-9_-]+$"}];
  string parent_id = 2;
}
message CreateFolderResponse { Folder folder = 1; }

message ListFoldersRequest {
  // Parent folder to browse: "" = root, or a uuid / DNS-style dotted path.
  string parent = 1;
  // When true, browse the parent's entire subtree; when false, only direct children.
  bool cascade = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  string page_token = 4;
}
message ListFoldersResponse { repeated Folder folders = 1; string next_page_token = 2; }

message CreateAssetRequest {
  string folder_id = 1 [(buf.validate.field).string.uuid = true];
  string name      = 2 [(buf.validate.field).string = {min_len: 1, max_len: 200, pattern: "^[a-zA-Z0-9_-]+$"}];
  // Exactly one arm required; the arm selects the kind. New kinds add arms here.
  oneof config {
    option (buf.validate.oneof).required = true;
    SSHConfigInput ssh = 3;
  }
}
message CreateAssetResponse { Asset asset = 1; }

message GetAssetRequest { string asset_id = 1 [(buf.validate.field).string.uuid = true]; }
message GetAssetResponse { Asset asset = 1; }

// GetAssetDisplay returns an asset's decision context for a request party. It
// mirrors Asset/SSHConfig/SSHLogin but deliberately carries NO secret references
// (SSHLoginDisplay has no secret_id field) so it can never leak vault material.
message GetAssetDisplayRequest { string asset_id = 1 [(buf.validate.field).string.uuid = true]; }
message GetAssetDisplayResponse { AssetDisplay asset = 1; }
message AssetDisplay {
  string id = 1;
  string folder_id = 2;
  string name = 3;
  string kind = 4;
  oneof config { SSHConfigDisplay ssh = 5; }
  string path = 6;
  string folder_path = 7;
}
message SSHConfigDisplay {
  repeated SSHLoginDisplay logins = 1;
  string host_public_key = 2;
  string target_address = 3;
}
message SSHLoginDisplay {
  string login = 1;
  string kind = 2; // ca | password | key — secret_id intentionally omitted
}

message UpdateAssetConfigRequest {
  string asset_id = 1 [(buf.validate.field).string.uuid = true];
  oneof config {
    option (buf.validate.oneof).required = true;
    SSHConfigInput ssh = 2;
  }
}
message UpdateAssetConfigResponse {}

message DeleteAssetRequest  { string asset_id = 1 [(buf.validate.field).string.uuid = true]; }
message DeleteAssetResponse {}

message UpdateAssetRequest {
  string asset_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name      = 2;  // present = rename
  optional string folder_id = 3;  // present = move to this folder
}
message UpdateAssetResponse { Asset asset = 1; }

message DeleteFolderRequest  { string folder_id = 1 [(buf.validate.field).string.uuid = true]; }
message DeleteFolderResponse {}

message UpdateFolderRequest {
  string folder_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name      = 2;  // present = rename
  optional string parent_id = 3;  // present = move under this parent ("" = root)
}
message UpdateFolderResponse { Folder folder = 1; }

message ListAssetsRequest {
  // Parent folder to browse: "" = root, or a uuid / DNS-style dotted path.
  string parent = 1;
  // When true, browse the parent's entire subtree; when false, only direct children.
  bool cascade = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  string page_token = 4;
}
message ListAssetsResponse { repeated Asset assets = 1; string next_page_token = 2; }

// RoleRef names a role for discovery: its id, name, and the leaf->root dotted path
// of its scoped folder (empty = a global role).
message RoleRef {
  string id = 1;
  string name = 2;
  string folder_path = 3;
}

message GetAssetAccessRequest { string asset_id = 1 [(buf.validate.field).string.uuid = true]; }
message GetAssetAccessResponse {
  repeated string active_role_ids = 1;
  repeated string requestable_role_ids = 2;
  repeated RoleRef active_roles = 3;
  repeated RoleRef requestable_roles = 4;
  // capabilities is the caller's effective data-plane (connect) capability set for
  // this asset — the same set the worker enforces connect against. It is resolved
  // via the full scope cascade (global + ancestor folders + the asset), so a
  // folder-scoped or explicit global data-plane grant appears here. The single
  // carve-out is the literal `**` super-capability, which is stripped: an admin's
  // `**` confers management everywhere but does NOT by itself grant proxy/connect
  // access, so it does not appear here. Thus this faithfully mirrors connect
  // ability rather than management authority.
  repeated string capabilities = 5;
  // management_capabilities is the caller's effective MANAGEMENT capability set on
  // this asset — resolved via the full scope cascade (global + ancestor folders +
  // the asset) and, unlike `capabilities`, WITHOUT stripping `**`. It mirrors
  // GetFolderAccess.capabilities and drives the asset's authoring affordances
  // (rename / move / delete / edit config), which are management actions and must
  // not be gated on the connect set.
  repeated string management_capabilities = 6;
}

message GetFolderAccessRequest { string folder_id = 1 [(buf.validate.field).string.uuid = true]; }
message GetFolderAccessResponse {
  // The caller's management capabilities on this folder (e.g. "catalog:folder:read").
  repeated string capabilities = 1;
}

// ResolveAsset maps a caller-supplied reference (a uuid or a DNS-style dotted path
// like "pg-primary.db.prod") to an asset id, but only for an asset the caller can
// reach. An unknown ref and a ref the caller cannot see return the same NotFound.
message ResolveAssetRequest  { string ref = 1 [(buf.validate.field).string = {min_len: 1}]; }
message ResolveAssetResponse { string asset_id = 1; string path = 2; }

// ResolveFolder maps a caller-supplied reference (a uuid or a DNS-style dotted path
// like "db.prod", or a single segment for a top-level folder) to a folder id. Admin
// only; an unknown ref returns NotFound.
message ResolveFolderRequest  { string ref = 1 [(buf.validate.field).string = {min_len: 1}]; }
message ResolveFolderResponse { string folder_id = 1; string path = 2; }

// ListFolderContents returns the first bounded slice (up to 50 items per kind) of
// each child kind visible to the caller under a given folder. parent="" = root.
// has_more indicates additional items exist beyond the returned slice; callers
// wanting more should use the dedicated per-kind List RPCs with full pagination.
message ListFolderContentsRequest {
  // Parent folder: "" = root, or a uuid / DNS-style dotted path.
  string parent = 1;
}
message ListFolderContentsResponse {
  repeated Folder                     folders       = 1;
  bool                                folders_has_more = 2;
  repeated Asset                      assets        = 3;
  bool                                assets_has_more  = 4;
  repeated jumpgate.access.v1.Role    roles         = 5;
  bool                                roles_has_more   = 6;
  repeated jumpgate.identity.v1.Group groups        = 7;
  bool                                groups_has_more  = 8;
}

// SearchCatalog finds catalog entities whose name matches the query (case-insensitive
// substring), filtered to what the caller may see (visibility-filtered, so existence
// is hidden by construction), capped at limit. Any authenticated caller.
message SearchCatalogRequest {
  string query = 1;
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}
message SearchCatalogResponse { repeated SearchHit hits = 1; }
message SearchHit {
  string kind = 1; // folder | asset | role | group
  string id = 2;
  string name = 3;
  string path = 4; // dotted path (assets/folders/roles); group @-path where applicable
}
