syntax = "proto3";

package jumpgate.approval.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/trevex/jumpgate/warden/gen/jumpgate/approval/v1;approvalv1";

// ApprovalService manages approval rules (admin) and resolves the effective rule.
service ApprovalService {
  rpc CreateApprovalRule(CreateApprovalRuleRequest) returns (CreateApprovalRuleResponse) {}
  rpc DeleteApprovalRule(DeleteApprovalRuleRequest) returns (DeleteApprovalRuleResponse) {}
  rpc ListApprovalRules(ListApprovalRulesRequest) returns (ListApprovalRulesResponse) {}
  rpc AddRuleApprover(AddRuleApproverRequest) returns (AddRuleApproverResponse) {}
  rpc RemoveRuleApprover(RemoveRuleApproverRequest) returns (RemoveRuleApproverResponse) {}
  rpc ResolveApproval(ResolveApprovalRequest) returns (ResolveApprovalResponse) {}
}

message ApprovalRule {
  string id = 1;
  string role_id = 2;
  string scope_folder_id = 3; // empty = not folder-scoped
  string scope_asset_id = 4; // empty = not asset-scoped ; both empty = role-level default
  int32 required_approvals = 5;
  string approver_role_id = 6; // empty = no approver-role source
}

message CreateApprovalRuleRequest {
  string role_id = 1 [(buf.validate.field).string.uuid = true];
  string scope_folder_id = 2; // optional; empty for role-default or asset scope
  string scope_asset_id = 3; // optional
  int32 required_approvals = 4 [(buf.validate.field).int32 = {
    gte: 1,
    lte: 20
  }];
  string approver_role_id = 5; // optional
}

message CreateApprovalRuleResponse {
  ApprovalRule rule = 1;
}

message DeleteApprovalRuleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteApprovalRuleResponse {}

message ListApprovalRulesRequest {
  string role_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListApprovalRulesResponse {
  repeated ApprovalRule rules = 1;
}

message AddRuleApproverRequest {
  string rule_id = 1 [(buf.validate.field).string.uuid = true];
  string subject_user_id = 2; // exactly one of user/group
  string subject_group_id = 3;
}

message AddRuleApproverResponse {
  string id = 1;
}

message RemoveRuleApproverRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RemoveRuleApproverResponse {}

message ResolveApprovalRequest {
  string role_id = 1 [(buf.validate.field).string.uuid = true];
  string asset_id = 2 [(buf.validate.field).string.uuid = true];
}

message ResolveApprovalResponse {
  bool requestable = 1; // false = no rule => not JIT-requestable
  int32 required_approvals = 2;
  string approver_role_id = 3;
}
