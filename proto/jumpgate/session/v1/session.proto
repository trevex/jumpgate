syntax = "proto3";

package jumpgate.session.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/trevex/jumpgate/warden/gen/jumpgate/session/v1;sessionv1";

// SessionService is the CLI-facing entrypoint to open a data-plane session. It is
// authenticated by the standard bearer-token interceptor.
service SessionService {
  // CreateSession authorizes the caller to reach the asset (held-closure SSH-login
  // check) and returns a short-lived admission token plus the gateway to dial.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {}

  // CreateWebSession mints a short-lived, cookie-authenticated admission ticket for
  // a browser terminal (no client SSH key). Same grant/entitlement check as CreateSession.
  rpc CreateWebSession(CreateWebSessionRequest) returns (CreateWebSessionResponse) {}

  // CreatePostgresSession authorizes the caller to reach a postgres asset via the
  // given DB role (held-closure db:login check) and mints a bearer admission token
  // (no client-key binding) plus the asset's default database.
  rpc CreatePostgresSession(CreatePostgresSessionRequest) returns (CreatePostgresSessionResponse) {}
}

message CreateSessionRequest {
  string asset_id = 1 [(buf.validate.field).string.uuid = true];
  bytes client_ssh_public_key = 2 [(buf.validate.field).bytes.min_len = 1];
}

message CreateSessionResponse {
  string session_token = 1;
  string gateway_endpoint = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CreateWebSessionRequest {
  string asset_id = 1 [(buf.validate.field).string.uuid = true];
  string login = 2 [(buf.validate.field).string.min_len = 1];
  // insecure (DEV ONLY) asks for the plaintext (ws://) gateway endpoint. The
  // frontend sets it only when the console is itself served over plain http. It
  // is honored only when warden allows insecure sessions; otherwise the secure
  // endpoint is returned (fail-closed).
  bool insecure = 3;
}

message CreateWebSessionResponse {
  string ticket = 1;
  string gateway_endpoint = 2;
  google.protobuf.Timestamp expires_at = 3;
  // insecure is true only when the gateway_endpoint is the plaintext one; the
  // frontend uses it to pick ws:// vs wss://.
  bool insecure = 4;
}

message CreatePostgresSessionRequest {
  string asset_id = 1 [(buf.validate.field).string.uuid = true];
  string login    = 2 [(buf.validate.field).string = {min_len: 1}];
}
message CreatePostgresSessionResponse {
  string session_token    = 1;
  string gateway_endpoint = 2;
  string default_database = 3;
}
