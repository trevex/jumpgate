# rdp-proxy is its OWN workspace (excluded from the root workspace), not a member.
# ironrdp-connector 0.10 pulls picky =7.0.0-rc.25, which hard-pins
# curve25519-dalek =5.0.0-rc.1; ssh-proxy's russh needs stable curve25519-dalek
# ^5 (=5.0.0). Those two constraints have an empty intersection, so the RDP stack
# and the SSH stack cannot share a single Cargo.lock. Separate workspaces give
# each worker its own lockfile — they are independent deployables anyway. Build
# this crate from workers/rdp-proxy (its own root); the root workspace builds the
# rest. Collapse back into the root workspace if the IronRDP/picky stack ever
# moves to stable curve25519-dalek.
[workspace]
[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "rdp-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "rdp-proxy"
path = "src/main.rs"

[lib]
name = "rdp_proxy"
path = "src/lib.rs"

[dependencies]
jumpgate-mesh = { path = "../../mesh" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-stream = "0.1"
# Match ssh-proxy's rustls crypto setup: a single (ring) provider workspace-wide.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# Read the target-server CA PEM into a RootCertStore when the asset pins one.
rustls-pemfile = "2"
# Scrub the warden-injected target password from our copy on drop.
zeroize = "1"
# ERROR opcode payload is JSON {"message":...}; serde_json escapes it safely.
serde_json = "1"
# IronRDP connector + async I/O. Pinned to the published versions (the P0 PoC
# used git-master, whose Config/API differ). connect 0.10 tracks pdu ^0.9.
ironrdp-connector = "0.10"
ironrdp-pdu = "0.9"
# `reqwest` feature provides ReqwestNetworkClient (the CredSSP network client
# connect_finalize requires; unused while enable_credssp=false but still typed).
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
# Extract the target's TLS server public key from its leaf cert (for CredSSP).
x509-cert = "0.2"
# Session-recording upload stack, ported verbatim from ssh-proxy: rusty-s3 signs
# S3 multipart requests, reqwest (rustls-no-provider → ring installed by us) sends
# them, sha2/hex for the recording digest, async-trait for the PartUploader seam.
rusty-s3 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
url = "2"
webpki-roots = "1"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
ironrdp-rdcleanpath = "0.2.2"
ironrdp-core = "0.2.1"
