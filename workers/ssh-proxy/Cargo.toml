[package]
name = "ssh-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "ssh-proxy"
path = "src/main.rs"

[lib]
name = "ssh_proxy"
path = "src/lib.rs"

[dependencies]
jumpgate-mesh = { path = "../../mesh" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tonic = { version = "0.12", features = ["tls"] }
tokio-stream = "0.1"
prost = "0.13"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
thiserror = "1"
# rand 0.10 to match russh/ssh-key's rand_core 0.10 CryptoRng bound (key + cert
# generation). `rand::rng()` yields a CryptoRng ThreadRng.
rand = { version = "0.10", features = ["thread_rng"] }
russh = "0.62.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = "1"
aws-config = "1"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
