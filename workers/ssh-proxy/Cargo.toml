[package]
name = "ssh-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "ssh-proxy"
path = "src/main.rs"

[lib]
name = "ssh_proxy"
path = "src/lib.rs"

[dependencies]
jumpgate-mesh = { path = "../../mesh" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-stream = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
thiserror = "1"
# rand 0.10 to match russh/ssh-key's rand_core 0.10 CryptoRng bound (key + cert
# generation). `rand::rng()` yields a CryptoRng ThreadRng.
rand = { version = "0.10", features = ["thread_rng"] }
# russh defaults pull aws-lc-rs; switch to the ring provider so the whole
# workspace stays on a single (ring) rustls CryptoProvider.
russh = { version = "0.62.7", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Scrub warden-injected target secrets (password / private-key PEM) from memory
# on drop. Our copies only — russh keeps its own — but it closes the window on
# our side and gives the secret variants a redacting home.
zeroize = "1"
# Object-storage upload: rusty-s3 is a sans-IO S3 request signer; reqwest does
# the HTTP. reqwest uses `rustls-no-provider` so it pulls NO crypto provider —
# we hand it a rustls::ClientConfig backed by the ring provider (see record.rs),
# keeping aws-lc-rs out of the tree.
rusty-s3 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
url = "2"
webpki-roots = "1"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
